<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="format-detection" content="telephone=no, date=no">
    <title>Gerador de Relatório Técnico - SUPEX</title>
    <!-- Biblioteca PDF.js para processar os anexos e ler o PDF recuperado -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js"></script>
    <script>
        if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <style>
        /* ESTILOS GERAIS */
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; color: #000; counter-reset: pageNum; }
        .container { max-width: 900px; margin: 20px auto; background: #fff; padding: 40px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], input[type="date"], input[type="time"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: Arial, sans-serif;}
        .inline-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .inline-group input, .inline-group select { width: auto; flex-grow: 1; min-width: 120px; }
        
        button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s;}
        .btn-primary { background-color: #0056b3; color: white; }
        .btn-primary:hover { background-color: #004494; }
        .btn-mic { background-color: #dc3545; color: white; padding: 8px; margin-left: 5px; }
        .btn-add { background-color: #28a745; color: white; margin-top: 10px; }
        .btn-generate { background-color: #17a2b8; color: white; font-size: 18px; width: 100%; padding: 15px; margin-top: 20px; }
        .btn-load { background-color: #fd7e14; color: white; display: inline-block; }
        
        .dynamic-group { border: 1px dashed #ccc; padding: 15px; margin-bottom: 15px; background: #fafafa; }
        .dynamic-item { display: flex; gap: 10px; margin-bottom: 5px; align-items: center; }
        .dynamic-item select { flex: 1; }
        .dynamic-item input[type="text"] { flex: 1; }

        /* Estilo dos Cards de Foto - ARRASTAR E SOLTAR */
        .photo-card { border: 1px solid #ddd; padding: 10px; text-align: center; background: #fff; margin-bottom: 10px; position: relative; cursor: grab; transition: 0.2s;}
        .photo-card:active { cursor: grabbing; }
        .photo-card.drag-over { border: 2px dashed #0056b3; background-color: #f0f8ff; opacity: 0.8; transform: scale(1.02); }
        .photo-card img { max-width: 100%; height: 200px; object-fit: cover; margin-bottom: 10px; border-radius: 4px; pointer-events: none;}
        
        .card-header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .drag-indicator { font-size: 12px; color: #777; font-weight: bold; pointer-events: none; }
        .btn-delete-photo { background: rgba(220, 53, 69, 0.9); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        /* ESTILOS DE IMPRESSÃO */
        #reportView { display: none; background: white; padding: 0; }
        .toolbar { text-align: center; margin-bottom: 20px; padding: 15px; background: #333; color: white; border-radius: 8px;}

        /* Tabela Contínua com Bordas */
        .print-table { width: 100%; max-width: 100%; border-collapse: collapse; border: 1px solid #000; table-layout: fixed; }
        .print-table thead { display: table-header-group; }
        .print-table tfoot { display: table-footer-group; }
        .print-table tbody { display: table-row-group; }
        
        .print-table th, .print-table td { border-left: 1px solid #000; border-right: 1px solid #000; padding: 15px 20px; background: white; word-wrap: break-word;}
        .print-table th { border-bottom: none; border-top: 1px solid #000; padding-top: 20px; padding-bottom: 5px; }
        .print-table td { border-top: none; }
        .print-table tfoot td { border-top: none; border-bottom: 1px solid #000; padding-top: 40px; padding-bottom: 15px; }

        .print-body { font-size: 14px; line-height: 1.6; text-align: justify; }
        .print-group-wrapper { page-break-inside: avoid; break-inside: avoid; margin-bottom: 10px; }
        
        .print-body h4 { background-color: #e9e9e9; padding: 5px 10px; margin: 10px 0; text-transform: uppercase; font-size: 13px; border-left: 4px solid #333; }
        .print-body ul { list-style-type: none; padding-left: 0; margin-top: 0; }
        .print-body ul li { margin-bottom: 5px; padding-left: 20px; position: relative; }
        .print-body ul li:before { content: '✓'; position: absolute; left: 0; font-weight: bold; }
        
        .section-title { font-size: 15px; font-weight: bold; margin-top: 20px; margin-bottom: 10px; border-bottom: 1px solid #000; padding-bottom: 3px; page-break-after: avoid; break-after: avoid;}
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }

        .print-signature { text-align: center; margin-top: 60px; page-break-inside: avoid; }
        .print-signature div { border-top: 1px solid #000; width: 350px; margin: 0 auto; padding-top: 5px; font-weight: bold;}

        .page-number-display::before { counter-increment: pageNum; content: "Página " counter(pageNum); }

        /* GRID PARA 6 FOTOS NA IMPRESSÃO */
        .photo-print-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 10px; page-break-inside: avoid;}
        .photo-print-item { border: 1px solid #999; padding: 5px; text-align: center; background: white; page-break-inside: avoid; }
        .photo-print-img { width: 100%; height: 200px; object-fit: cover; margin-bottom: 5px; display: block;}
        .photo-print-legend { font-size: 12px; font-weight: bold; line-height: 1.2; max-height: 30px; overflow: hidden;}

        #metadataExport { font-size: 1px; color: white; opacity: 0.01; line-height: 1px; overflow: hidden; height: 1px; user-select: none;}

        @media print {
            body, html { background: white; margin: 0; padding: 0; }
            .container { max-width: 100%; box-shadow: none; padding: 0; margin: 0; border: none; }
            .no-print { display: none !important; }
            @page { margin: 10mm; } 
        }

        /* ===== COMPATIBILIDADE MOBILE (iOS / Android) ===== */
        :root { color-scheme: light; }
        html { -webkit-text-size-adjust: 100%; }
        input[type="text"], input[type="date"], input[type="time"], select, textarea { font-size: 16px; background: #fff; color: #000; }
        input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; min-height: 42px; }
        button { -webkit-appearance: none; appearance: none; touch-action: manipulation; min-height: 40px; font-family: Arial, sans-serif; }
        .file-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
        .grid-fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .btn-move { background: #6c757d; color: #fff; padding: 5px 10px; font-size: 14px; min-height: 32px; margin-right: 4px; }
        .card-header-actions .acoes { display: flex; align-items: center; }
        .print-body h4 { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        @media (hover: none) { .drag-indicator { display: none; } .photo-card { cursor: default; } }
        @media screen and (max-width: 700px) {
            .container { margin: 0; padding: 15px; box-shadow: none; }
            .inline-group label { margin-left: 0 !important; width: 100%; }
            .inline-group input, .inline-group select { flex: 1 1 100%; min-width: 0; }
            .dynamic-item { flex-wrap: wrap; }
            .dynamic-item select, .dynamic-item input[type="text"] { flex: 1 1 100%; min-width: 0; }
            .grid-fotos { grid-template-columns: 1fr; }
            .info-grid { grid-template-columns: 1fr; }
            .info-grid > div { text-align: left !important; }
            .print-table th, .print-table td { padding: 10px; }
            .print-signature div { width: 90%; }
            .photo-print-img { height: 120px; }
            .toolbar button { margin: 4px !important; }
            .btn-mic { margin-left: 0; margin-top: 5px; }
        }

        /* ===== PÁGINAS DO RELATÓRIO (Página X/Y) ===== */
        #paginasRelatorio { margin: 0 auto; }
        .pagina { position: relative; width: 190mm; height: 274mm; margin: 0 auto 15px; background: #fff; border: 1px solid #000; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 6px rgba(0,0,0,.2); }
        .pagina-head { flex: none; height: 28mm; display: flex; align-items: center; justify-content: center; }
        .pagina-head img { height: 70px; display: block; }
        .pagina-body { flex: 1; min-height: 0; padding: 4px 20px; overflow: hidden; }
        .pagina-body.cheio { display: flex; flex-direction: column; }
        .pagina-foot { flex: none; height: 14mm; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-style: italic; }
        .pagina-meta { position: absolute; left: 0; bottom: 0; width: 100%; font-size: 1px; line-height: 1px; color: #fff; word-break: break-all; pointer-events: none; }
        .print-body .item { position: relative; margin-bottom: 5px; padding-left: 20px; }
        .print-body .item:before { content: '✓'; position: absolute; left: 0; font-weight: bold; }
        .print-body .item.fim { margin-bottom: 15px; }
        .print-body .para { margin: 0; }
        .foto-pagina { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .foto-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 4px 0 6px; }
        .foto-cell { display: flex; flex-direction: column; min-height: 0; border: 1px solid #999; padding: 5px; background: #fff; }
        .foto-box, .anexo-box { position: relative; flex: 1; min-height: 0; }
        .foto-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .anexo-box { margin: 6px 0; }
        .anexo-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .foto-leg { flex: none; margin-top: 5px; font-size: 12px; font-weight: bold; line-height: 1.2; text-align: center; max-height: 30px; overflow: hidden; }
        @media print {
            #paginasRelatorio { zoom: 1 !important; }
            .pagina { margin: 0; box-shadow: none; }
            .pagina:not(:last-child) { page-break-after: always; break-after: page; }
        }
    </style>
</head>

ht: 60px; display: block; margin: 0 auto;">
            <h2>Gerador de Relatório Técnico</h2>
            
            <div style="display: flex; justify-content: center; margin-top: 15px;">
                <label class="btn-load" style="cursor: pointer; padding: 10px 15px; border-radius: 4px; font-size: 14px; font-weight: bold; border: 1px solid #d36a11;">

                    <input type="file" class="file-hidden" accept="application/pdf,.pdf" onchange="carregarPdfCorrecao(event)">
                </label>
            </div>
            <p style="font-size: 12px; color: #555;">Recupera todos os textos de um PDF gerado por este sistema.</p>
        </div>

        <div class="form-group inline-group">
            <label>Número do Relatório:</label>
            <span>RL-SUPEX-</span>
            <input type="text" id="numRelatorio" placeholder="XXX-YYYY">
            
            <label style="margin-left: 10px;">Data:</label>
            <input type="date" id="dataRelatorio">
            
            <label style="margin-left: 10px;">Início:</label>
            <input type="time" id="horaInicio">
            
            <label style="margin-left: 10px;">Fim:</label>
            <input type="time" id="horaFim">
        </div>

        <div class="form-group">
            <label>Assunto:</label>
            <input type="text" id="assunto" value="Vistoria Técnica às frentes de serviço" placeholder="Digite o assunto do relatório...">
        </div>

        <div class="form-group">
            <label>Local:</label>
            <input type="text" id="local" placeholder="Digite o local da vistoria...">
        </div>

        <div class="form-group">
            <label>Objetivo: <button type="button" class="btn-mic" onclick="startDictation('objetivo')">🎤 Ditar</button></label>
            <textarea id="objetivo" rows="3" placeholder="O presente relatório tem por objetivo..."></textarea>
        </div>

        <div class="form-group">
            <label>DESCRIÇÃO DAS ATIVIDADES VERIFICADAS:</label>
            <div id="containerAtividades"></div>
            <button type="button" class="btn-add" onclick="adicionarGrupoAtividades()">+ Adicionar Local/Agrupamento</button>
        </div>

        <div class="form-group">
            <label>CONSIDERAÇÕES TÉCNICAS / FATOS RELEVANTES:</label>
            <div id="containerConsideracoes"></div>
            <button type="button" class="btn-add" onclick="adicionarGrupoConsideracoes()">+ Adicionar Tópico/Agrupamento</button>
        </div>

        <div class="form-group">
            <label>CONCLUSÃO: <button type="button" class="btn-mic" onclick="startDictation('conclusao')">🎤 Ditar</button></label>
            <textarea id="conclusao" rows="5" placeholder="Redija a conclusão..."></textarea>
        </div>

        <div class="form-group">
            <label>Assinatura (Nome e Cargo/Matrícula):</label>
            <textarea id="assinatura" rows="3" placeholder="Ex: Marcus Vinicius A. Álvares Filho&#10;Coordenador de Engenharia..."></textarea>
        </div>

        <div class="form-group" style="background: #e9ecef; padding: 15px; border-radius: 5px;">
            <label>📸 Anexar Fotos da Vistoria</label>
            <p style="font-size: 12px; margin-top: 0;"><strong>Dica:</strong> Use ⬆ ⬇ (ou arraste, no computador) para mudar a ordem.</p>
            <input type="file" id="uploadFotos" multiple accept="image/*" onchange="carregarFotos(event)">
            <div id="gridFotos" class="grid-fotos"></div>
        </div>

        <div class="form-group" style="background: #e9ecef; padding: 15px; border-radius: 5px;">
            <label>📄 Anexar Projetos / Alvarás (Apenas PDF)</label>

            <input type="file" id="uploadPdf" multiple accept="application/pdf,.pdf" onchange="carregarPdfs(event)">
            <div id="pdfPreviews" style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;"></div>
        </div>

        <button type="button" class="btn-generate" onclick="gerarRelatorio()">GERAR RELATÓRIO PARA IMPRESSÃO</button>
    </div>

    <!-- ==================== TELA DE IMPRESSÃO ==================== -->
    <div id="reportView">
        <div class="toolbar no-print">
            <button class="btn-primary" onclick="voltarEdicao()" style="background: #6c757d;">⬅ Voltar para Edição</button>
            <button class="btn-primary" onclick="imprimirRelatorio()" style="background: #28a745; margin-left: 10px;">🖨️ IMPRIMIR / SALVAR PDF</button>
        </div>

        <div id="paginasRelatorio"></div>
    </div>
</div>

<script>
    // ----- FUNÇÕES DE BASE64 SEGURA PARA IOS (WEBP / WEBKIT / SAFARI) -----
    function utf8_to_b64(str) {
        return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
            return String.fromCharCode('0x' + p1);
        }));
    }

    function b64_to_utf8(str) {
        return decodeURIComponent(Array.prototype.map.call(atob(str), function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
    }

    function esc(v) {
        return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ----- MAPEAMENTO DE ATIVIDADES PREDEFINIDAS -----

        canteiro: [
            "Confecção de Camisas Metálicas",

            "Armação de Lajes",
            "Concretagem de Lajes",
            "Confecção de Bases de Apoios (\"inserts\")",
            "Pintura de Bases de Apoios (\"inserts\")",
            "Confecção de Guarda Corpo",
            "Pintura de Guarda Corpo",
            "Confecção de Viga de Distribuição",
            "Pintura de Viga de Distribuição",
            "Confecção de Contraventamento",
            "Pintura de Contraventamento",
            "Outros"
        ],
        plp: [
            "Cravação de Camisa Metálica",
            "Arrasamento de Camisa Metálica",
            "Instalação de Base de Apoio",
            "Posicionamento de Viga de Distribuição",

            "Posicionamento de Lajes Pré Moldadas",
            "Instalação de Guarda Corpo",
            "Instalação de Contraventamento",
            "Confecção de Viga Caixa Pré Moldada",
            "Outros"
        ],
        ponte: [
            "Cravação de Camisa Metálica",
            "Escavação de Estaca",
            "Montagem de Armadura interna",
            "Concretagem de Estaca",
            "Arrasamento de Camisa Metálica",

    // ----- CRIAÇÃO DE AGRUPAMENTOS DE ATIVIDADES COM LISTA SUSPENSA -----
    function adicionarGrupoAtividades(tituloSel = '', tituloOutros = '', itens = []) {
        tituloSel = String(tituloSel || '').replace(/^\d+\.\s*/, ''); // compatível com relatórios antigos numerados
        const container = document.getElementById('containerAtividades');
        const groupDiv = document.createElement('div');
        groupDiv.className = 'dynamic-group atividade-group';

        groupDiv.innerHTML = `
            <div style="margin-bottom: 10px;">
                <label style="font-size: 13px;">Selecione o Agrupamento / Frente de Serviço:</label>
                <select class="group-select" onchange="aoMudarAgrupamento(this)">
                    <option value="">-- Selecione o Agrupamento --</option>
                    <option value="Canteiro de Jaburu - Veracruz" data-tipo="canteiro">Canteiro de Jaburu - Veracruz</option>
                    <option value="Canteiro Jequitaia - Salvador" data-tipo="canteiro">Canteiro Jequitaia - Salvador</option>
                    <option value="Canteiro Central - Baía de Todos os Santos" data-tipo="canteiro">Canteiro Central - Baía de Todos os Santos</option>
                    <option value="Canteiro Estaleiro São Roque do Paraguaçu" data-tipo="canteiro">Canteiro Estaleiro São Roque do Paraguaçu</option>
                    <option value="PLP Veracruz" data-tipo="plp">PLP Veracruz</option>
                    <option value="PLP Salvador" data-tipo="plp">PLP Salvador</option>
                    <option value="PLP Vão Central" data-tipo="plp">PLP Vão Central</option>
                    <option value="Ponte Definitiva Oeste - Vera Cruz" data-tipo="ponte">Ponte Definitiva Oeste - Vera Cruz</option>
                    <option value="Ponte Definitiva Leste - Vera Cruz" data-tipo="ponte">Ponte Definitiva Leste - Vera Cruz</option>
                    <option value="Ponte Definitiva - Vão Central" data-tipo="ponte">Ponte Definitiva - Vão Central</option>
                    <option value="Outros" data-tipo="outros">Outros (digitação livre)</option>
                </select>
                <input type="text" class="group-title-outros" placeholder="Digite o nome do agrupamento..." style="display:none; margin-top: 5px;" value="${esc(tituloOutros)}">
            </div>
            <div class="items-list"></div>
            <button type="button" class="btn-add" style="padding: 5px 10px; font-size: 12px; margin-top: 5px;" onclick="adicionarItemAtividade(this.previousElementSibling)">+ Adicionar Atividade</button>
        `;

        container.appendChild(groupDiv);

        const select = groupDiv.querySelector('.group-select');
        if (tituloSel) {
            select.value = tituloSel;
            aoMudarAgrupamento(select);
        }

        const lista = groupDiv.querySelector('.items-list');
        if (itens.length > 0) {
            itens.forEach(it => {
                let actVal = typeof it === 'object' ? it.atividade : it;
                let specVal = typeof it === 'object' ? it.especifico : '';
                adicionarItemAtividade(lista, actVal, specVal);
            });
        } else {
            adicionarItemAtividade(lista);
        }
    }

    function aoMudarAgrupamento(selectElem) {
        const groupDiv = selectElem.closest('.atividade-group');
        const inputOutros = groupDiv.querySelector('.group-title-outros');
        
        if (selectElem.value === 'Outros') {
            inputOutros.style.display = 'block';
        } else {
            inputOutros.style.display = 'none';
        }

        const selectsAtividade = groupDiv.querySelectorAll('.atividade-select');
        selectsAtividade.forEach(sel => atualizarOpcoesAtividade(sel, selectElem));
    }

    function atualizarOpcoesAtividade(selectAtividade, selectAgrupamento) {
        const valAtual = selectAtividade.value;
        const selectedOpt = selectAgrupamento.options[selectAgrupamento.selectedIndex];
        const tipo = selectedOpt ? selectedOpt.getAttribute('data-tipo') : '';

        let listaOpcoes = [];
        if (tipo && OPCOES_ATIVIDADES[tipo]) {
            listaOpcoes = OPCOES_ATIVIDADES[tipo];
        } else {
            listaOpcoes = Array.from(new Set([...OPCOES_ATIVIDADES.canteiro, ...OPCOES_ATIVIDADES.plp, ...OPCOES_ATIVIDADES.ponte]));

    let draggedItem = null;

    function lerComoDataURL(file) {
        return new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(r.result);
            r.onerror = () => rej(r.error);
            r.readAsDataURL(file);
        });
    }

    // Reduz a foto (fotos de iPhone têm vários MB e derrubam a memória do Safari)
    function redimensionarImagem(file, maxDim = 1280, qualidade = 0.8) {
        return new Promise((resolve) => {
            const url = URL.createObjectURL(file);
            const fallback = () => { URL.revokeObjectURL(url); lerComoDataURL(file).then(resolve).catch(() => resolve(null)); };
            const img = new Image();
            img.onload = function () {
                try {
                    const f = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
                    const w = Math.max(1, Math.round(img.naturalWidth * f));
                    const h = Math.max(1, Math.round(img.naturalHeight * f));
                    const c = document.createElement('canvas');
                    c.width = w; c.height = h;
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    const out = c.toDataURL('image/jpeg', qualidade);
                    c.width = c.height = 0;
                    URL.revokeObjectURL(url);
                    resolve(out);
                } catch (e) { fallback(); }
            };
            img.onerror = fallback;
            img.src = url;
        });
    }

    function criarCardFoto(grid, src) {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `
            <div class="card-header-actions no-print">
                <span class="drag-indicator">☰ Arrastar</span>
                <span class="acoes">
                    <button type="button" class="btn-move" onclick="moverFoto(this, -1)" aria-label="Mover para cima">⬆</button>
                    <button type="button" class="btn-move" onclick="moverFoto(this, 1)" aria-label="Mover para baixo">⬇</button>
                    <button type="button" class="btn-delete-photo" onclick="removerFoto(this)">❌ Excluir</button>
                </span>

            <div style="display:flex; align-items:center;">
                <strong class="foto-num-label" style="white-space: nowrap;"></strong>
                <input type="text" class="legenda-input" placeholder="Digite a legenda..." style="margin-left:5px;">
            </div>
        `;
        card.querySelector('img').src = src;

        if (SUPORTA_DRAG) {
            card.setAttribute('draggable', 'true');
            card.addEventListener('dragstart', function (evt) {
                draggedItem = this;
                if (evt.dataTransfer) { evt.dataTransfer.effectAllowed = 'move'; evt.dataTransfer.setData('text/plain', ''); }
                setTimeout(() => this.style.opacity = '0.4', 0);
            });
            card.addEventListener('dragover', function (evt) { evt.preventDefault(); });
            card.addEventListener('dragenter', function (evt) { evt.preventDefault(); if (draggedItem && this !== draggedItem) this.classList.add('drag-over'); });
            card.addEventListener('dragleave', function () { this.classList.remove('drag-over'); });
            card.addEventListener('drop', function (evt) {
                evt.preventDefault(); evt.stopPropagation();
                this.classList.remove('drag-over');
                if (draggedItem && draggedItem !== this) { this.parentNode.insertBefore(draggedItem, this); }
            });
            card.addEventListener('dragend', function () {
                this.style.opacity = '1';
                draggedItem = null;
                document.querySelectorAll('.photo-card').forEach(c => c.classList.remove('drag-over'));
                atualizarNumeracaoFotos();
            });
        }

        grid.appendChild(card);
        atualizarNumeracaoFotos();
    }

    function moverFoto(botao, direcao) {
        const card = botao.closest('.photo-card');
        const pai = card.parentNode;
        if (direcao < 0 && card.previousElementSibling) pai.insertBefore(card, card.previousElementSibling);
        else if (direcao > 0 && card.nextElementSibling) pai.insertBefore(card.nextElementSibling, card);
        atualizarNumeracaoFotos();
        card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function removerFoto(botao) {

    // ----- PDFS (Projetos/Alvarás) - COMPATÍVEL COM IOS -----
    window.pdfImagesData = [];

    function pdfOk() {
        if (window.pdfjsLib) return true;
        alert('A biblioteca de PDF não carregou. Verifique a conexão com a internet e recarregue a página.');
        return false;
    }

    async function carregarPdfs(event) {
        const files = Array.from(event.target.files || []);
        event.target.value = '';
        if (!files.length || !pdfOk()) return;
        const container = document.getElementById('pdfPreviews');
        window.pdfImagesData = [];
        const erros = [];

        for (const file of files) {
            try {
                const buf = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
                for (let i = 1; i <= pdf.numPages; i++) {
                    container.innerHTML = `<span style="color: blue;">Processando ${esc(file.name)} - página ${i}/${pdf.numPages}... Aguarde.</span>`;
                    const page = await pdf.getPage(i);
                    const base = page.getViewport({ scale: 1.0 });
                    const rot = base.width > base.height ? 90 : 0;
                    const v1 = page.getViewport({ scale: 1.0, rotation: rot });
                    // Limita os pixels (iOS falha com canvas gigante e perde memória com PNG)
                    const scale = Math.min(2, Math.sqrt(4000000 / (v1.width * v1.height)));
                    const viewport = page.getViewport({ scale: scale, rotation: rot });

                    const canvas = document.createElement('canvas');
                    canvas.width = Math.floor(viewport.width);
                    canvas.height = Math.floor(viewport.height);
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    window.pdfImagesData.push(canvas.toDataURL('image/jpeg', 0.85));
                    canvas.width = canvas.height = 0;
                    page.cleanup();
                }
                pdf.destroy();
            } catch (e) {
                console.error(e);
                erros.push(file.name + ' (' + (e && e.message ? e.message : 'erro') + ')');
            }
        }

        container.innerHTML = '';
        window.pdfImagesData.forEach((src) => {
            const img = document.createElement('img');
            img.src = src;
            img.style.height = '80px';
            img.style.border = '1px solid #ccc';
            container.appendChild(img);
        });
        if (erros.length) alert('Não foi possível processar: ' + erros.join(', '));
    }

    // ----- RECUPERAÇÃO DE DADOS LENDO O PDF FINAL -----
    async function carregarPdfCorrecao(event) {
        const file = event.target.files[0];
        if (!file || !pdfOk()) { event.target.value = ''; return; }

        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
            let fullText = '';

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join('');
                fullText += pageText;
            }

            const regex = /\[SUPEX[_ ]?DATA\]([\s\S]*?)\[\/SUPEX[_ ]?DATA\]/;
            const match = fullText.match(regex);

            if (match && match[1]) {
                const base64Data = match[1].replace(/\s+/g, '');
                const jsonStr = b64_to_utf8(base64Data);
                const data = JSON.parse(jsonStr);

                document.getElementById('numRelatorio').value = data.numRelatorio || '';
                document.getElementById('dataRelatorio').value = data.dataRelatorio || '';
                document.getElementById('horaInicio').value = data.horaInicio || '';
                document.getElementById('horaFim').value = data.horaFim || '';
                document.getElementById('assunto').value = data.assunto || 'Vistoria Técnica às frentes de serviço';
                document.getElementById('local').value = data.local || '';
                document.getElementById('objetivo').value = data.objetivo || '';
                document.getElementById('conclusao').value = data.conclusao || '';
                document.getElementById('assinatura').value = data.assinatura || '';

                document.getElementById('containerAtividades').innerHTML = '';
                document.getElementById('containerConsideracoes').innerHTML = '';

                if (data.atividades && data.atividades.length > 0) {
                    data.atividades.forEach(g => adicionarGrupoAtividades(g.titleSel, g.titleOutros, g.items));
                } else {
                    adicionarGrupoAtividades();
                }

                if (data.consideracoes && data.consideracoes.length > 0) {
                    data.consideracoes.forEach(g => adicionarGrupoConsideracoes(g.title, g.items));
                } else {
                    adicionarGrupoConsideracoes();
                }

                alert("Texto do relatório recuperado com sucesso!");
            } else {
                alert("Não foi possível encontrar a chave de recuperação (DNA) neste arquivo.");
            }
        } catch (error) {
            console.error(error);
            alert("Erro ao ler o arquivo PDF.");
        }
        event.target.value = ''; 
    }

    // ----- CONSTRUTOR DO RELATÓRIO PARA IMPRESSÃO -----
    function formatarData(dataISO) {
        if(!dataISO) return "";
        const p = dataISO.split('-');
        return `${p[2]}/${p[1]}/${p[0]}`;
    }

    function extrairDadosAtividades() {
        const groups = document.querySelectorAll('#containerAtividades .atividade-group');
        let data = [];
        groups.forEach(g => {
            let sel = g.querySelector('.group-select').value;
            let outros = g.querySelector('.group-title-outros').value.trim();
            let items = [];

            g.querySelectorAll('.dynamic-item').forEach(itemDiv => {
                let selAct = itemDiv.querySelector('.atividade-select').value;
                let outrosAct = itemDiv.querySelector('.atividade-outros').value.trim();
                let esp = itemDiv.querySelector('.atividade-especifico').value.trim();

                let actFinal = (selAct === 'Outros') ? outrosAct : selAct;
                if (actFinal) {
                    items.push({ atividade: actFinal, especifico: esp });
                }
            });

            if (sel || items.length > 0) {
                data.push({ titleSel: sel, titleOutros: outros, items: items });
            }
        });
        return data;
    }

    function extrairDadosConsideracoes() {
        const groups = document.querySelectorAll('#containerConsideracoes .consideracao-group');
        let data = [];
        groups.forEach(g => {
            let title = g.querySelector('.group-title').value.trim();
            let items = [];
            g.querySelectorAll('.item-input').forEach(input => {
                if(input.value.trim() !== '') items.push(input.value.trim());
            });
            if(title || items.length > 0) data.push({ title, items });
        });
        return data;
    }

    // ----- PAGINAÇÃO (Página X/Y) -----
    const FOTOS_POR_PAGINA = 6;

    function ajustarZoomRelatorio() {
        const rv = document.getElementById('reportView');
        const wrap = document.getElementById('paginasRelatorio');
        if (!rv || !wrap || rv.style.display === 'none') return;
        const p = wrap.querySelector('.pagina');
        if (!p) return;
        wrap.style.zoom = 1;
        wrap.style.zoom = Math.min(1, rv.clientWidth / p.offsetWidth);
    }
    window.addEventListener('resize', ajustarZoomRelatorio);

    function montarPaginas(d) {
        const logoEl = document.querySelector('#formView img');
        const LOGO = logoEl ? logoEl.src : '';
        const geradoEm = new Date().toLocaleString('pt-BR');
        const wrap = document.getElementById('paginasRelatorio');
        wrap.innerHTML = '';
        wrap.style.zoom = 1;
        const paginas = [];

        function novaPagina(cheia) {
            const p = document.createElement('div');
            p.className = 'pagina';
            p.innerHTML = '<div class="pagina-head">' + (LOGO ? '<img src="' + LOGO + '" alt="Estado da Bahia">' : '') + '</div>' +
                '<div class="pagina-body print-body' + (cheia ? ' cheio' : '') + '"></div>' +
                '<div class="pagina-foot"><span>Relatório gerado em: ' + esc(geradoEm) + '</span><span class="pag-num"></span></div>';
            wrap.appendChild(p);
            paginas.push(p);
            return p.querySelector('.pagina-body');
        }

        // Blocos do corpo do relatório
        const blocos = [];
        function add(tag, html, cls, keep, style) {
            const el = document.createElement(tag);
            if (cls) el.className = cls;
            if (style) el.style.cssText = style;
            el.innerHTML = html;
            blocos.push({ el: el, keep: !!keep });
        }
        function secao(t) { add('div', t, 'section-title', true); }

        add('div', '<h1 style="margin: 5px 0; font-size: 18px; text-decoration: underline; font-weight: bold;">RELATÓRIO TÉCNICO</h1><p style="margin: 0; font-size: 13px; font-weight: normal;">ACOMPANHAMENTO DE OBRAS - SISTEMA RODOVIÁRIO PONTE SALVADOR ITAPARICA<br>SVPONTE (SUPEX - Superintendência Executiva)</p>', null, false, 'text-align:center; margin-bottom:25px;');
        const hI = d.horaInicio, hF = d.horaFim;
        const horarios = (hI || hF) ? '(Das ' + esc(hI || '--') + ' às ' + esc(hF || '--') + ')' : '';
        add('div', '<div><strong>Número do Relatório:</strong> RL-SUPEX-' + esc(d.numRelatorio) + '</div><div style="text-align:right;"><strong>Data:</strong> ' + esc(formatarData(d.dataRelatorio)) + ' <span style="margin-left:10px;">' + horarios + '</span></div>', 'info-grid');
        add('div', '<strong>Assunto:</strong> ' + esc(d.assunto), null, false, 'margin-bottom:10px;');
        add('div', '<strong>Local:</strong> ' + esc(d.local), null, false, 'margin-bottom:10px;');
        add('div', '<strong>Objetivo:</strong> ' + esc(d.objetivo), null, false, 'margin-bottom:10px;');

        secao('Descrição das atividades verificadas:');
        d.atividades.forEach(g => {
            const titulo = (g.titleSel === 'Outros') ? g.titleOutros : g.titleSel;
            const itens = g.items.map(it => it.atividade + (it.especifico ? ' - ' + it.especifico : ''));
            if (titulo) add('h4', esc(titulo), null, itens.length > 0);
            itens.forEach((t, k) => add('div', esc(t), 'item' + (k === itens.length - 1 ? ' fim' : '')));
        });

        secao('Considerações Técnicas:');
        d.consideracoes.forEach(g => {
            if (g.title) add('h4', esc(g.title), null, g.items.length > 0);
            g.items.forEach((t, k) => add('div', esc(t), 'item' + (k === g.items.length - 1 ? ' fim' : '')));
        });

        secao('Conclusão:');
        const linhas = String(d.conclusao || '').split(/\r?\n/);
        linhas.forEach((ln, k) => add('div', esc(ln.trim()) || '&nbsp;', 'para', k === linhas.length - 1));
        add('div', '<div style="white-space:pre-wrap;">' + esc(d.assinatura) + '</div>', 'print-signature');

        // Distribui os blocos nas páginas, medindo a altura real
        const estoura = c => c.scrollHeight > c.clientHeight + 1;
        let corpo = novaPagina(false);
        let i = 0;
        while (i < blocos.length) {
            let j = i;
            while (blocos[j].keep && j + 1 < blocos.length) j++;
            const grupo = blocos.slice(i, j + 1);
            i = j + 1;
            grupo.forEach(b => corpo.appendChild(b.el));
            if (estoura(corpo) && corpo.children.length > grupo.length) {
                grupo.forEach(b => b.el.remove());
                corpo = novaPagina(false);
                grupo.forEach(b => corpo.appendChild(b.el));
            }
        }

        // Fotos: 6 por página, 2 colunas x 3 linhas
        const fotos = Array.from(document.querySelectorAll('#gridFotos .photo-card')).map(c => ({
            src: c.querySelector('img').src,
            leg: c.querySelector('.legenda-input').value.trim()
        }));
        for (let k = 0; k < fotos.length; k += FOTOS_POR_PAGINA) {
            const body = novaPagina(true);
            const celulas = fotos.slice(k, k + FOTOS_POR_PAGINA).map((f, idx) => {
                const n = String(k + idx + 1).padStart(2, '0');
                return '<div class="foto-cell"><div class="foto-box"><img src="' + f.src + '" alt=""></div><div class="foto-leg">Foto ' + n + (f.leg ? ' - ' + esc(f.leg) : '') + '</div></div>';
            }).join('');
            body.innerHTML = '<div class="foto-pagina">' + (k === 0 ? '<div class="section-title" style="flex:none; margin:10px 0 6px;">1. RELATÓRIO FOTOGRÁFICO</div>' : '') + '<div class="foto-grid">' + celulas + '</div></div>';
        }

        // Anexos em PDF: uma página do anexo por página do relatório
        (window.pdfImagesData || []).forEach((src, idx) => {
            const body = novaPagina(true);
            body.innerHTML = '<div class="foto-pagina">' + (idx === 0 ? '<div class="section-title" style="flex:none; margin:10px 0 6px;">2. PROJETOS E DOCUMENTOS ANEXOS</div>' : '') + '<div class="anexo-box"><img src="' + src + '" alt=""></div></div>';
        });

        // Dados para "Corrigir Relatório" (texto invisível na última página)
        const meta = document.createElement('div');
        meta.className = 'pagina-meta';
        meta.textContent = '[SUPEXDATA]' + utf8_to_b64(JSON.stringify(d)) + '[/SUPEXDATA]';
        paginas[paginas.length - 1].appendChild(meta);

        paginas.forEach((p, k) => { p.querySelector('.pag-num').textContent = 'Página ' + (k + 1) + '/' + paginas.length; });
        ajustarZoomRelatorio();
    }

    function startDictation(elementId) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
            alert("O ditado por voz não é suportado por este navegador. Use o microfone do teclado do celular.");
            return;
        }
        try {
            const recognition = new SR();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = "pt-BR";
            recognition.onresult = function (e) {
                const target = document.getElementById(elementId);
                target.value += (target.value ? " " : "") + e.results[0][0].transcript;
            };
            recognition.onerror = function (e) {
                if (e.error === 'not-allowed' || e.error === 'service-not-allowed') alert("Permita o acesso ao microfone/ditado nas configurações do navegador.");
                else if (e.error !== 'no-speech' && e.error !== 'aborted') alert("Não foi possível usar o ditado por voz. Use o microfone do teclado.");
            };
            recognition.start();
        } catch (err) {
            alert("Não foi possível iniciar o ditado. Use o microfone do teclado do celular.");
        }
    }

    window.onload = function() {
        adicionarGrupoAtividades();
        adicionarGrupoConsideracoes();
    };
</script>

</body>
</html>
