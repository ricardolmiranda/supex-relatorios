<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SUPEX</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        .login-box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #004494; }
        #erro { color: red; font-size: 14px; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Acesso ao Gerador</h2>
        <input type="text" id="usuario" placeholder="Usuário">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="fazerLogin()">Entrar</button>
        <p id="erro">Usuário ou senha incorretos!</p>
    </div>

    <script>
        function fazerLogin() {
            const usu = document.getElementById('usuario').value;
            const sen = document.getElementById('senha').value;

            // Lista de usuários e senhas permitidos
            const credenciais = {
                "emersoncardoso": "834404",
                "marcusalvares": "160758",
                "ricardomiranda": "334023",
                "nathaliapestana": "015283",
                "usuarioteste": "131313"
            };

            // Verifica se o usuário existe na lista e se a senha coincide
            if (credenciais[usu] && credenciais[usu] === sen) {
                // Redireciona para o gerador
                window.location.href = "gerador.html"; 
            } else {
                // Exibe a mensagem de erro
                document.getElementById('erro').style.display = 'block';
            }
        }
    </script>
</body>
</html>
